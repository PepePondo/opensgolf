name: multiplayer beta build

# A test build of the multiplayer branch (private until launch), by hand only: Windows, macOS and Linux packages built
# with the `multiplayer` feature, put on a prerelease of THIS private repository. It never touches the public repository,
# Homebrew or winget (release.yml does those for real releases), and nothing here runs on a push.
#
# The beta's "Check for updates" still sees the public releases: updating from one replaces the beta with a public build
# without multiplayer (download the next beta again instead).
on:
  workflow_dispatch:
    inputs:
      server:
        description: "The multiplayer Worker's address (empty: the one in mp/result.rs)"
        required: false
        default: ""

permissions:
  contents: write

env:
  OPENSGOLF_BOARD_URL: ${{ inputs.server }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux packages
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libasound2-dev libudev-dev
      - name: Build
        run: |
          [ -n "$OPENSGOLF_BOARD_URL" ] || unset OPENSGOLF_BOARD_URL
          cargo build --release -p opensgolf --features multiplayer
          cargo build --release -p sgtool
      - name: Test the multiplayer part
        run: |
          [ -n "$OPENSGOLF_BOARD_URL" ] || unset OPENSGOLF_BOARD_URL
          cargo test --release -p opensgolf --features multiplayer mp::
          cd multiplayer/worker && node --test test/*.test.mjs
      - name: Package
        run: |
          out=opensgolf-mp-beta-linux-x86_64
          mkdir -p "$out"
          cp target/release/opensgolf "$out/"
          target/release/sgtool icon icons 256
          cp icons/icon_256.png "$out/opensgolf.png"
          cp LICENSE "$out/"
          cp -r packs lang "$out/"
          tar czf "$out.tar.gz" "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: opensgolf-mp-beta-*.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build
        run: |
          [ -n "$OPENSGOLF_BOARD_URL" ] || unset OPENSGOLF_BOARD_URL
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$t" -p opensgolf --features multiplayer
          done
          cargo build --release --target aarch64-apple-darwin -p sgtool
      - name: OpenSGolf.app
        run: |
          app=OpenSGolf.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/opensgolf" target/aarch64-apple-darwin/release/opensgolf target/x86_64-apple-darwin/release/opensgolf
          cp -r packs lang "$app/Contents/MacOS/"
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          sed "s/@VERSION@/$v/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          target/aarch64-apple-darwin/release/sgtool icon icons 16 32 64 128 256 512 1024
          set=opensgolf.iconset && mkdir -p "$set"
          for n in 16 32 128 256 512; do
            cp "icons/icon_$n.png" "$set/icon_${n}x${n}.png"
            cp "icons/icon_$((n * 2)).png" "$set/icon_${n}x${n}@2x.png"
          done
          iconutil -c icns "$set" -o "$app/Contents/Resources/opensgolf.icns"
          codesign --force --deep --sign - "$app"
          out=opensgolf-mp-beta-macos
          mkdir -p "$out" && mv "$app" "$out/" && cp LICENSE "$out/"
          ditto -c -k --keepParent "$out" "$out.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: opensgolf-mp-beta-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        shell: bash
        run: |
          [ -n "$OPENSGOLF_BOARD_URL" ] || unset OPENSGOLF_BOARD_URL
          cargo build --release -p opensgolf --features multiplayer
          cargo build --release -p sgtool
      - name: Package
        shell: bash
        run: |
          out=opensgolf-mp-beta-windows
          mkdir -p "$out"
          cp target/release/opensgolf.exe "$out/"
          target/release/sgtool.exe icon icons 256
          cp icons/icon_256.png "$out/opensgolf.png"
          cp LICENSE "$out/"
          cp -r packs lang "$out/"
          7z a "$out.zip" "$out" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: opensgolf-mp-beta-windows.zip

  prerelease:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mp-beta-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Multiplayer beta ${{ github.run_number }}
          prerelease: true
          body: |
            A test build of the multiplayer branch (${{ github.sha }}). Private: don't share the files outside the test.
            Start New Game lists the Weekly challenge and Shared clubs.
          files: dist/*
