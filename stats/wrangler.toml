# OpenSGolf's play-time stats Worker (stats/README.md). Deploy from this folder: npx wrangler@4.152.0 deploy
name = "opensgolf-stats"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# The GoatCounter import of older builds' counts: every day at 04:00 UTC (daily, so one failed run costs a day, not a
# week). Remove this to retire it (the stats page says when), then deploy again.
[triggers]
crons = ["0 4 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "opensgolf-stats"
database_id = "4feb91e9-dbbd-4110-aee0-14d1d8f31b6e"

[observability]
enabled = true

# The multiplayer server's database (multiplayer/worker), read only, for the page's Multiplayer section (src/mp.js).
[[d1_databases]]
binding = "BOARD"
database_name = "opensgolf-board"
database_id = "f9841ce7-7018-47cf-9c3a-0bc85ef1cdcc"

# Pull request previews (Cloudflare Workers Builds runs `wrangler preview` on non-main branches). Previews use their
# own copies of the two databases (copied from production on 2026-11-25), so PR code can never write to live data.
# To refresh a copy: wrangler d1 export <db> --remote --output x.sql, then d1 execute <db>-preview --remote --file x.sql
# on an emptied copy.
[[previews.d1_databases]]
binding = "DB"
database_name = "opensgolf-stats-preview"
database_id = "1ecc71fe-c820-4b64-b4f8-eef5db1a6e43"

[[previews.d1_databases]]
binding = "BOARD"
database_name = "opensgolf-board-preview"
database_id = "546aa87b-fc34-498d-96ee-87d0832bf9e5"
