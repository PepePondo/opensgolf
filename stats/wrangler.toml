# OpenSGolf's play-time stats Worker (stats/README.md). Deploy from this folder: npx wrangler@4.152.0 deploy
name = "opensgolf-stats"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# The GoatCounter import of older builds' counts: every day at 04:00 UTC (daily, so one failed run costs a day, not a
# week). Remove this to retire it (the stats page says when), then deploy again.
[triggers]
crons = ["0 4 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "opensgolf-stats"
database_id = "4feb91e9-dbbd-4110-aee0-14d1d8f31b6e"

[observability]
enabled = true
